[package]
name = "labrador"
version = "0.3.0"
authors = ["mrpan <1049058427@qq.com>"]
edition = "2018"
description = "Labrador - Mini thirdpart client for rust."
readme = "README.md"
keywords = ["alipay", "wechat", "jd", "taobao", "pdd"]
categories = ["api-bindings"]
homepage = "https://github.com/woofcloud/labrador"
repository = "https://github.com/woofcloud/labrador"
documentation = "https://docs.rs/labrador"
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls", "multipart", "stream"] }
tokio-util = "0.7.18"
tokio = {version = "1", features = ["full"]}
bytes = { version = "1.1.0", features = ["serde"] }
moka = { version = "0.12", features = ["future", "sync"] }
r2d2 = {version = "0.8.9"}
chrono = { version = "0.4", features = ["serde"]}
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
sxd-document = {version = "0.2", optional= true}
sxd-xpath = {version = "0.2", optional= true}
serde-xml-rs = "0.6.0"
serde_urlencoded = "0.7.1"
urlencoding = "2.1.0"
tracing = { version = "0.1.35"}
dashmap = "6.1"
json = {version = "0.12.4", optional= true }
once_cell = "1.8"


# about crypt
ring = "0.17"
aes = "0.8"
sha1 = "0.10.5"
sha2 = "0.10.8"
md5 = "0.7.0"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
hex = "0.4"
base64 = "0.21"
block-padding = "0.3.2"
cbc = { version = "0.1", features = ["std"] }
ecb = { version = "0.1.2" }
# OpenSSL后端
openssl = { version = "0.10.41", features=["vendored"] }

# Rust后端（非OpenSSL）
rsa = { version = "0.9.5", features = ["sha1", "sha2"] }
aes-gcm = { version = "0.10.3" }
ctr = { version = "0.9.2" }
cfb-mode = { version = "0.8" }



thiserror = "1.0"

bincode = "1.3.3"
x509-parser = {version = "0.14.0", features=["verify"], optional= true}
url = "2.5.8"
http = "1.3"
quick-xml = { version = "0.39.0", features = ["serialize"] }
async-trait = "0.1.89"
futures = "0.3.31"
percent-encoding = "2.3.2"
regex = "1.12.3"
digest = "0.10.7"
cfg-if = "1.0.0"
typenum = "1.19.0"

[dev-dependencies]
tokio = { version = "1",  features=["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs"
]
### FEATURES #################################################################

[features]
default = ["x509-parser"]
openssl-crypto = []

# Provide wechat
wechat = [ "sxd-document", "sxd-xpath"]
# Provide alipay
alipay = [ "json"]
# Provide taobao
taobao = []
# Provide pinduoduo
pdd = []
# Provide jingdong
jd = []
# Provide qiniu
qiniu = []

# Examples
[[example]]
name = "wechat_mp"
required-features = ["wechat"]

[[example]]
name = "wechat_miniapp"
required-features = ["wechat"]

[[example]]
name = "wechat_cp"
required-features = ["wechat"]

[[example]]
name = "wechat_pay"
required-features = ["wechat"]

[[example]]
name = "alipay"
required-features = ["alipay"]

[[example]]
name = "payment_tester"
required-features = ["wechat", "alipay"]
